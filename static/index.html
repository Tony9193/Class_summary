<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程录音转文字+AI智能总结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <h1 class="text-xl font-bold text-indigo-600">课程笔记助手</h1>
                </div>
                <div class="flex items-center space-x-8">
                    <button onclick="switchTab('transcribe')" 
                            class="tab-btn active" data-tab="transcribe">
                        录音转写
                    </button>
                    <button onclick="switchTab('history')" 
                            class="tab-btn" data-tab="history">
                        历史记录
                    </button>
                    <button onclick="openSettings()" 
                            class="text-gray-500 hover:text-gray-700 p-2 rounded-lg hover:bg-gray-100"
                            title="设置">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- 录音转写页 -->
        <div id="tab-transcribe" class="tab-content">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- 左侧：音频输入 -->
                <div class="space-y-6">
                    <!-- 文件上传 -->
                    <div class="bg-white rounded-lg shadow p-6">
                        <h2 class="text-lg font-semibold mb-4">上传音频文件</h2>
                        <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center
                                    hover:border-indigo-400 transition-colors" 
                             id="drop-zone">
                            <input type="file" id="audio-file" accept=".mp3,.wav,.ogg,.m4a,.flac" 
                                   class="hidden" onchange="handleFileSelect(this)">
                            <label for="audio-file" class="cursor-pointer">
                                <div class="text-gray-400 mb-2">
                                    <svg class="mx-auto h-12 w-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                              d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                                    </svg>
                                </div>
                                <p class="text-sm text-gray-600">点击或拖拽文件到此处</p>
                                <p class="text-xs text-gray-400 mt-1">支持 MP3, WAV, OGG, M4A, FLAC（最大500MB）</p>
                            </label>
                        </div>
                        <div id="file-info" class="hidden mt-4 p-3 bg-gray-50 rounded">
                            <p class="text-sm text-gray-600" id="file-name"></p>
                            <p class="text-xs text-gray-500 mt-1" id="file-duration"></p>
                        </div>
                        
                        <!-- 降噪开关 -->
                        <div class="mt-4 flex items-center justify-between p-3 bg-amber-50 rounded-lg border border-amber-200">
                            <div class="flex items-center space-x-2">
                                <svg class="w-5 h-5 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                          d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
                                </svg>
                                <span class="text-sm font-medium text-amber-800">音频降噪</span>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="enable-denoise" class="sr-only peer">
                                <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-amber-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-amber-600"></div>
                            </label>
                        </div>
                        <p class="text-xs text-gray-500 mt-1">开启后会对嘈杂的课堂录音进行降噪处理（处理时间稍长）</p>
                        
                        <button onclick="startTranscribe()" id="btn-transcribe"
                                class="mt-4 w-full bg-indigo-600 text-white py-2 px-4 rounded-lg
                                       hover:bg-indigo-700 disabled:bg-gray-400 disabled:cursor-not-allowed"
                                disabled>
                            开始转写
                        </button>
                    </div>

                    <!-- 实时录音 -->
                    <div class="bg-white rounded-lg shadow p-6">
                        <h2 class="text-lg font-semibold mb-4">实时录音</h2>
                        <div class="flex justify-center space-x-4">
                            <button onclick="toggleRecording()" id="btn-record"
                                    class="bg-red-500 text-white py-3 px-6 rounded-full
                                           hover:bg-red-600 flex items-center space-x-2">
                                <span id="record-icon">●</span>
                                <span id="record-text">开始录音</span>
                            </button>
                        </div>
                        <div id="recording-status" class="hidden mt-4 text-center">
                            <p class="text-red-500 animate-pulse" id="recording-time">录音中: 00:00</p>
                        </div>
                    </div>
                </div>

                <!-- 右侧：转写结果 -->
                <div class="space-y-6">
                    <!-- 转写结果 -->
                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-lg font-semibold">转写结果</h2>
                            <button onclick="copyText('transcription')" 
                                    class="text-sm text-indigo-600 hover:text-indigo-800">
                                复制
                            </button>
                        </div>
                        <div id="transcription-result" 
                             class="min-h-[200px] max-h-[400px] overflow-y-auto p-4 bg-gray-50 rounded-lg">
                            <p class="text-gray-400 italic">等待转写...</p>
                        </div>
                    </div>

                    <!-- AI总结 -->
                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-lg font-semibold">AI智能总结</h2>
                            <button onclick="generateSummary()" id="btn-summary"
                                    class="bg-green-600 text-white py-1.5 px-4 rounded-lg text-sm
                                           hover:bg-green-700 disabled:bg-gray-400 disabled:cursor-not-allowed"
                                    disabled>
                                生成总结
                            </button>
                        </div>
                        <div id="summary-result" 
                             class="min-h-[200px] max-h-[400px] overflow-y-auto p-4 bg-gray-50 rounded-lg">
                            <p class="text-gray-400 italic">等待生成总结...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 历史记录页 -->
        <div id="tab-history" class="tab-content hidden">
            <div class="bg-white rounded-lg shadow">
                <!-- 搜索栏 -->
                <div class="p-4 border-b">
                    <div class="flex space-x-4">
                        <input type="text" id="search-keyword" placeholder="搜索关键词..."
                               class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <button onclick="searchHistory()" 
                                class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700">
                            搜索
                        </button>
                    </div>
                </div>
                
                <!-- 记录列表 -->
                <div id="history-list" class="divide-y">
                    <div class="p-8 text-center text-gray-400">
                        加载中...
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 加载提示 -->
    <div id="loading" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto mb-4"></div>
            <p id="loading-text" class="text-gray-600">处理中...</p>
        </div>
    </div>

    <!-- 提示消息 -->
    <div id="toast" class="hidden fixed top-4 right-4 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg z-50">
    </div>

    <!-- 设置弹窗 -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4">
            <div class="flex justify-between items-center p-6 border-b">
                <h2 class="text-xl font-semibold">设置</h2>
                <button onclick="closeSettings()" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <!-- 阶跃星辰 API Key -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        阶跃星辰 API Key
                        <span id="step-key-status" class="ml-2 text-xs"></span>
                    </label>
                    <input type="password" id="step-api-key" placeholder="sk-..."
                           class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <p class="text-xs text-gray-400 mt-1">用于ASR语音识别，<a href="https://platform.stepfun.com" target="_blank" class="text-indigo-500">获取Key</a></p>
                </div>

                <!-- LLM API Key -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        AI模型 API Key
                        <span id="llm-key-status" class="ml-2 text-xs"></span>
                    </label>
                    <input type="password" id="llm-api-key" placeholder="sk-..."
                           class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <p class="text-xs text-gray-400 mt-1">用于AI总结，支持DeepSeek/MiMo等</p>
                </div>

                <!-- LLM Base URL -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">AI模型 Base URL</label>
                    <input type="text" id="llm-base-url" placeholder="https://api.deepseek.com"
                           class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <p class="text-xs text-gray-400 mt-1">OpenAI兼容接口地址</p>
                </div>

                <!-- LLM Model -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">AI模型名称</label>
                    <input type="text" id="llm-model" placeholder="deepseek-v4-flash"
                           class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <!-- 测试按钮 -->
                <div class="flex space-x-4 pt-2">
                    <button onclick="testAsrConnection()" 
                            class="flex-1 bg-gray-100 text-gray-700 py-2 px-4 rounded-lg hover:bg-gray-200 text-sm">
                        测试ASR连接
                    </button>
                    <button onclick="testLlmConnection()" 
                            class="flex-1 bg-gray-100 text-gray-700 py-2 px-4 rounded-lg hover:bg-gray-200 text-sm">
                        测试AI连接
                    </button>
                </div>
            </div>
            <div class="flex justify-end space-x-4 p-6 border-t bg-gray-50 rounded-b-lg">
                <button onclick="closeSettings()" 
                        class="px-4 py-2 text-gray-600 hover:text-gray-800">
                    取消
                </button>
                <button onclick="saveSettings()" 
                        class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
                    保存
                </button>
            </div>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/recorder.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
